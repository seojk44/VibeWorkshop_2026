<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>온라인 산책길</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #05070f;
      color: #e9dcc6;
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    #hint {
      position: fixed;
      left: 50%;
      bottom: 140px;
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(10, 12, 24, 0.6);
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      transition: opacity 1.5s;
    }
    #hint.hidden {
      opacity: 0;
    }
    #treeCount {
      position: fixed;
      left: 50%;
      top: 16px;
      transform: translateX(-50%);
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(10, 12, 24, 0.6);
      font-size: 15px;
      white-space: nowrap;
      pointer-events: none;
    }
    #peopleCount {
      position: fixed;
      left: 50%;
      top: 54px;
      transform: translateX(-50%);
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(10, 12, 24, 0.5);
      font-size: 13px;
      white-space: nowrap;
      pointer-events: none;
    }
    #viewTreeButton {
      position: fixed;
      left: 50%;
      bottom: max(72px, calc(env(safe-area-inset-bottom) + 60px));
      transform: translateX(-50%);
      min-width: 160px;
      min-height: 48px;
      padding: 0 24px;
      border: 1px solid rgba(255, 190, 120, 0.6);
      border-radius: 999px;
      background: rgba(120, 52, 18, 0.85);
      color: #fff1dc;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.3s, background 0.3s;
    }
    #viewTreeButton:active {
      transform: translateX(-50%) scale(0.96);
    }
    #viewTreeButton.far {
      opacity: 0.45;
      background: rgba(60, 40, 30, 0.85);
    }
    #soundButton,
    #chatToggle,
    #chatSendButton {
      position: fixed;
      top: 12px;
      right: 12px;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid rgba(255, 190, 120, 0.45);
      border-radius: 999px;
      background: rgba(10, 12, 24, 0.7);
      color: #fff1dc;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    #soundButton[aria-pressed="true"] {
      background: rgba(120, 52, 18, 0.85);
    }
    #chatToggle {
      top: 60px;
    }
    #chatForm {
      position: fixed;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(520px, calc(100% - 32px));
      display: flex;
      gap: 8px;
    }
    #chatForm[hidden] {
      display: none;
    }
    #chatInput {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid rgba(255, 190, 120, 0.45);
      border-radius: 999px;
      background: rgba(10, 12, 24, 0.75);
      color: #fff1dc;
      font: inherit;
      font-size: 16px;
    }
    #chatInput::placeholder {
      color: rgba(233, 220, 198, 0.6);
    }
    #chatSendButton {
      position: static;
      min-height: 44px;
    }
    #chatInput:disabled,
    #chatSendButton:disabled {
      opacity: 0.5;
      cursor: default;
    }
    #bubbleLayer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .chatBubble {
      position: absolute;
      transform: translate(-50%, -100%);
      max-width: min(240px, 70vw);
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(255, 246, 230, 0.92);
      color: #2a1a10;
      font-size: 14px;
      line-height: 1.35;
      text-align: center;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div id="hint">three.js를 불러오는 중…</div>
  <div id="treeCount">오늘 본 나무 0그루</div>
  <div id="peopleCount">연결하는 중…</div>
  <button id="viewTreeButton" type="button">나무 보기</button>
  <button id="soundButton" type="button" aria-pressed="false">소리 켜기</button>
  <button id="chatToggle" type="button">채팅 끄기</button>
  <div id="bubbleLayer"></div>
  <form id="chatForm" autocomplete="off">
    <input id="chatInput" type="text" maxlength="60" aria-label="채팅 입력" placeholder="짧은 말 (개인정보는 쓰지 마세요)" disabled>
    <button id="chatSendButton" type="submit" disabled>보내기</button>
  </form>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const GROUND_HALF_WIDTH = 30;
    const GROUND_HALF_LENGTH = 80;
    const PATH_WIDTH = 3.2;
    const WALK_SPEED = 3.5;
    const TURN_SPEED = 2.6;
    const CAMERA_DISTANCE = 7;
    const CAMERA_HEIGHT = 3.6;
    const TREE_REACH = 1.5;
    const VIEW_SECONDS = 3;
    const TREE_SEED = 20261110;
    const TREE_RECEIVE_GAP_MS = 1000;
    const TREE_STORAGE_KEY = 'online-walk-tree-count';

    const hint = document.getElementById('hint');
    const treeCountLabel = document.getElementById('treeCount');
    const viewTreeButton = document.getElementById('viewTreeButton');
    const soundButton = document.getElementById('soundButton');
    const SOUND_VOLUME = 0.8;
    let audio = null;
    let soundOn = false;
    let birdTimer = null;

    const APP_ID = 'hoseo-vibe-walk-path-seojk44';
    const ROOM_NAMES = ['lobby', 'lobby-2'];
    const ROOM_LIMIT = 8;
    const ROOM_SETTLE_MS = 5000;
    let joinRoomFunction = null;
    let currentRoom = null;
    let roomName = ROOM_NAMES[0];
    let roomCheckTimer = null;
    const TRYSTERO_URL = 'https://cdn.jsdelivr.net/npm/trystero@0.22.0/+esm';
    const POSE_INTERVAL_MS = 200;
    const PEER_TIMEOUT_MS = 5000;
    const SPAWN_START_Z = 72;
    const SPAWN_GAP = 1.5;
    const WALK_HALF_WIDTH = 5;
    const BODY_RADIUS = 0.4;
    const peopleLabel = document.getElementById('peopleCount');
    const peers = new Map();
    let roomState = 'connecting';
    let joinedAt = 0;
    let hasMoved = false;
    let sendPoseAction = null;
    let sendTreeAction = null;

    const CHAT_MAX_LENGTH = 60;
    const CHAT_BUBBLE_MS = 6000;
    const CHAT_SEND_GAP_MS = 1500;
    const CHAT_RECEIVE_GAP_MS = 1000;
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const chatSendButton = document.getElementById('chatSendButton');
    const chatToggle = document.getElementById('chatToggle');
    const bubbleLayer = document.getElementById('bubbleLayer');
    const chatBubbles = new Map();
    let chatOn = true;
    let lastChatSentAt = -Infinity;
    let sendChatAction = null;
    let hintTimer = null;
    let soundBoostStart = -Infinity;
    let myView = null;
    let treeDate = '';
    let treeCount = 0;
    const pressedKeys = new Set();
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    // 장면, 카메라, 렌더러
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b1a);
    scene.fog = new THREE.FogExp2(0x070b1a, 0.045);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 400);

    const skyLight = new THREE.HemisphereLight(0xb8c8e8, 0x3a3020, 0.35);
    scene.add(skyLight);
    const sunLight = new THREE.DirectionalLight(0x8fa6d8, 0.25);
    sunLight.position.set(-20, 30, -10);
    scene.add(sunLight);

    function createWalkGround() {
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(GROUND_HALF_WIDTH * 2, GROUND_HALF_LENGTH * 2),
        new THREE.MeshStandardMaterial({ color: 0x5d8a46, roughness: 1 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const path = new THREE.Mesh(
        new THREE.PlaneGeometry(PATH_WIDTH, GROUND_HALF_LENGTH * 2),
        new THREE.MeshStandardMaterial({ color: 0x9c7a55, roughness: 1 })
      );
      path.rotation.x = -Math.PI / 2;
      path.position.y = 0.01;
      path.receiveShadow = true;
      scene.add(path);

      return ground;
    }

    const treeParts = {
      trunkGeometry: new THREE.CylinderGeometry(0.18, 0.25, 1.4, 8),
      trunkMaterial: new THREE.MeshStandardMaterial({ color: 0x6b4a30, roughness: 1 }),
      leafGeometries: [0, 1, 2].map((layer) => new THREE.ConeGeometry(1.4 - layer * 0.35, 1.8, 10)),
      leafMaterial: new THREE.MeshStandardMaterial({ color: 0x2f6b3a, roughness: 1 })
    };
    const trees = [];

    function createSeededRandom(seed) {
      let state = seed >>> 0;
      return () => {
        state = (state + 0x6d2b79f5) >>> 0;
        let value = state;
        value = Math.imul(value ^ (value >>> 15), value | 1);
        value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
        return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
      };
    }

    function createTree(x, z, size, castShadow, random) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(treeParts.trunkGeometry, treeParts.trunkMaterial);
      trunk.position.y = 0.7;
      trunk.castShadow = castShadow;
      tree.add(trunk);

      const leaves = new THREE.Group();
      leaves.position.y = 1.4;
      treeParts.leafGeometries.forEach((geometry, layer) => {
        const cone = new THREE.Mesh(geometry, treeParts.leafMaterial);
        cone.position.y = 0.3 + layer * 0.9;
        cone.castShadow = castShadow;
        leaves.add(cone);
      });
      tree.add(leaves);

      tree.scale.setScalar(size);
      tree.position.set(x, 0, z);
      tree.rotation.y = random() * Math.PI;
      scene.add(tree);
      trees.push({
        index: trees.length,
        tree,
        leaves,
        trunkRadius: 0.25 * size,
        topHeight: 4.4 * size,
        phase: random() * Math.PI * 2,
        sway: 0.03 + random() * 0.02,
        shakeStart: -Infinity
      });
    }

    function createTreeRows() {
      const random = createSeededRandom(TREE_SEED);
      const pathEdge = PATH_WIDTH / 2;
      for (let z = -GROUND_HALF_LENGTH + 4; z <= GROUND_HALF_LENGTH - 4; z += 6) {
        for (const side of [-1, 1]) {
          const nearX = side * (pathEdge + 1 + random() * 1.4);
          createTree(nearX, z + (random() - 0.5) * 2, 0.9 + random() * 0.5, true, random);
          if (random() < 0.6) {
            const farX = side * (6 + random() * 8);
            createTree(farX, z + (random() - 0.5) * 4, 1 + random() * 0.7, false, random);
          }
        }
      }
    }

    function readViewCurve(time, start) {
      const progress = (time - start) / VIEW_SECONDS;
      if (progress < 0 || progress >= 1) return 0;
      return Math.sin(progress * Math.PI);
    }

    function swayLeaves(time) {
      for (const item of trees) {
        const amount = item.sway * (1 + readViewCurve(time, item.shakeStart) * 2);
        item.leaves.rotation.x = Math.sin(time * 1.1 + item.phase) * amount;
        item.leaves.rotation.z = Math.sin(time * 0.8 + item.phase * 1.7) * amount * 0.7;
      }
    }

    function createStars() {
      const count = 900;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(Math.random() * 0.92 + 0.08);
        const radius = 180;
        positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = radius * Math.cos(phi);
        positions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const stars = new THREE.Points(
        geometry,
        new THREE.PointsMaterial({ color: 0xdfe6ff, size: 2, sizeAttenuation: false, fog: false, transparent: true })
      );
      scene.add(stars);
      return stars;
    }

    function createBlock(width, height, depth, material) {
      const block = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
      block.castShadow = true;
      return block;
    }

    function createLimb(width, height, material, x, y) {
      const pivot = new THREE.Group();
      pivot.position.set(x, y, 0);
      const block = createBlock(width, height, width, material);
      block.position.y = -height / 2;
      pivot.add(block);
      return pivot;
    }

    function createCharacter(coatColor = 0x7a3b3b) {
      const character = new THREE.Group();
      const skin = new THREE.MeshStandardMaterial({ color: 0xe9c8a0, roughness: 0.8, emissive: 0x2a1c12 });
      const shirt = new THREE.MeshStandardMaterial({ color: coatColor, roughness: 0.8, emissive: 0x24100e });
      const pants = new THREE.MeshStandardMaterial({ color: 0x2b3550, roughness: 0.9, emissive: 0x0a0c14 });
      const hairMaterial = new THREE.MeshStandardMaterial({ color: 0x4a3020, roughness: 0.9 });
      const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0x1a1a1a });

      const doll = new THREE.Group();

      const body = createBlock(0.46, 0.55, 0.26, shirt);
      body.position.y = 0.825;
      doll.add(body);

      const legLeft = createLimb(0.2, 0.55, pants, -0.11, 0.55);
      const legRight = createLimb(0.2, 0.55, pants, 0.11, 0.55);
      const armLeft = createLimb(0.16, 0.55, shirt, -0.31, 1.1);
      const armRight = createLimb(0.16, 0.55, shirt, 0.31, 1.1);
      for (const hand of [armLeft, armRight]) {
        const skinBlock = createBlock(0.16, 0.12, 0.16, skin);
        skinBlock.position.y = -0.49;
        hand.add(skinBlock);
      }
      doll.add(legLeft, legRight, armLeft, armRight);

      const head = new THREE.Group();
      head.position.y = 1.1;
      const face = createBlock(0.4, 0.4, 0.4, skin);
      face.position.y = 0.2;
      const hairTop = createBlock(0.42, 0.08, 0.42, hairMaterial);
      hairTop.position.y = 0.38;
      const hairBack = createBlock(0.42, 0.24, 0.06, hairMaterial);
      hairBack.position.set(0, 0.27, -0.19);
      head.add(face, hairTop, hairBack);
      for (const side of [-1, 1]) {
        const eye = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.02), eyeMaterial);
        eye.position.set(side * 0.09, 0.22, 0.205);
        head.add(eye);
      }
      doll.add(head);

      character.add(doll);
      character.userData.doll = doll;
      character.userData.parts = { head, armLeft, armRight, legLeft, legRight };
      character.userData.walkPhase = 0;
      character.userData.walkAmount = 0;
      scene.add(character);
      return character;
    }

    function poseCharacter(target, lookUp) {
      const { head, armLeft, armRight, legLeft, legRight } = target.userData.parts;
      const amount = target.userData.walkAmount;
      const swing = Math.sin(target.userData.walkPhase) * 0.6 * amount;
      armLeft.rotation.x = swing;
      armRight.rotation.x = -swing;
      legLeft.rotation.x = -swing;
      legRight.rotation.x = swing;
      head.rotation.x = lookUp * 1.5;
      target.userData.doll.position.y = Math.abs(Math.sin(target.userData.walkPhase)) * 0.05 * amount;
    }

    function stepWalkAnimation(target, moving, delta) {
      const goal = moving ? 1 : 0;
      target.userData.walkAmount += (goal - target.userData.walkAmount) * (1 - Math.exp(-delta * 10));
      if (moving) target.userData.walkPhase += delta * 10;
    }

    function createTargetMarker() {
      const marker = new THREE.Mesh(
        new THREE.RingGeometry(0.25, 0.35, 32),
        new THREE.MeshBasicMaterial({ color: 0xffd9a0, transparent: true, opacity: 0, depthWrite: false })
      );
      marker.rotation.x = -Math.PI / 2;
      marker.position.y = 0.03;
      scene.add(marker);
      return marker;
    }

    const ground = createWalkGround();
    createTreeRows();
    const reachableTrees = trees.filter((item) => Math.abs(item.tree.position.x) < WALK_HALF_WIDTH + 1);
    const walkObstacles = reachableTrees.map((item) => ({
      x: item.tree.position.x,
      z: item.tree.position.z,
      radius: item.trunkRadius
    }));

    const LEAF_POOL_SIZE = 60;
    const LEAVES_PER_VIEW = 12;
    const LEAF_COLORS = [0x3f8a45, 0x6aa84f, 0xc9b23a, 0xd98c2b];

    function createLeafPool() {
      const geometry = new THREE.BoxGeometry(0.14, 0.02, 0.1);
      const pool = [];
      for (let i = 0; i < LEAF_POOL_SIZE; i++) {
        const material = new THREE.MeshStandardMaterial({
          color: LEAF_COLORS[i % LEAF_COLORS.length],
          roughness: 0.9,
          transparent: true
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.visible = false;
        scene.add(mesh);
        pool.push({ mesh, active: false, plan: null, age: 0 });
      }
      return pool;
    }

    function planLeafDrop(center, size, random, count) {
      const leaves = [];
      for (let i = 0; i < count; i++) {
        const angle = random() * Math.PI * 2;
        const radius = random() * 1.1 * size;
        const startY = (2 + random() * 1.8) * size;
        leaves.push({
          x: center.x + Math.cos(angle) * radius,
          z: center.z + Math.sin(angle) * radius,
          startY,
          life: 3 + random(),
          swayAmount: 0.15 + random() * 0.25,
          swaySpeed: 2 + random() * 2,
          spinX: (random() - 0.5) * 6,
          spinZ: (random() - 0.5) * 6,
          phase: random() * Math.PI * 2
        });
      }
      return leaves;
    }

    function readLeafState(plan, age) {
      const progress = Math.min(age / plan.life, 1);
      return {
        x: plan.x + Math.sin(plan.phase + age * plan.swaySpeed) * plan.swayAmount,
        y: plan.startY * (1 - progress),
        z: plan.z + Math.cos(plan.phase * 1.3 + age * plan.swaySpeed * 0.8) * plan.swayAmount * 0.5,
        opacity: progress > 0.7 ? (1 - progress) / 0.3 : 1,
        done: progress >= 1
      };
    }

    const leafPool = createLeafPool();
    let nextLeafSlot = 0;

    function dropLeaves(item) {
      const plans = planLeafDrop(item.tree.position, item.tree.scale.x, Math.random, LEAVES_PER_VIEW);
      for (const plan of plans) {
        const slot = leafPool[nextLeafSlot];
        nextLeafSlot = (nextLeafSlot + 1) % leafPool.length;
        slot.active = true;
        slot.plan = plan;
        slot.age = 0;
        slot.mesh.visible = true;
        slot.mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      }
    }

    function updateFallingLeaves(delta) {
      for (const slot of leafPool) {
        if (!slot.active) continue;
        slot.age += delta;
        const state = readLeafState(slot.plan, slot.age);
        if (state.done) {
          slot.active = false;
          slot.mesh.visible = false;
          continue;
        }
        slot.mesh.position.set(state.x, state.y, state.z);
        slot.mesh.rotation.x += slot.plan.spinX * delta;
        slot.mesh.rotation.z += slot.plan.spinZ * delta;
        slot.mesh.material.opacity = state.opacity;
      }
    }

    const BIRD_POOL_SIZE = 12;
    const BIRD_COLORS = [0x6b4a30, 0x7a7d85, 0x2b3550];
    const BIRD_SPREAD = (50 * Math.PI) / 180;

    function createFlyingBird(color) {
      const bird = new THREE.Group();
      const bodyMaterial = new THREE.MeshStandardMaterial({ color, roughness: 0.8, transparent: true });
      const beakMaterial = new THREE.MeshStandardMaterial({ color: 0xe0a030, roughness: 0.6, transparent: true });

      const body = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.12, 0.26), bodyMaterial);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.12), bodyMaterial);
      head.position.set(0, 0.05, 0.17);
      const beak = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.03, 0.06), beakMaterial);
      beak.position.set(0, 0.04, 0.26);
      const tail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.02, 0.1), bodyMaterial);
      tail.position.set(0, 0.02, -0.17);
      bird.add(body, head, beak, tail);

      const wings = [];
      for (const side of [-1, 1]) {
        const pivot = new THREE.Group();
        pivot.position.set(side * 0.07, 0.03, 0);
        const wing = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.02, 0.14), bodyMaterial);
        wing.position.x = side * 0.11;
        pivot.add(wing);
        bird.add(pivot);
        wings.push({ pivot, side });
      }

      bird.scale.setScalar(1.3);
      bird.visible = false;
      scene.add(bird);
      return { bird, wings, materials: [bodyMaterial, beakMaterial] };
    }

    function createBirdPool() {
      const pool = [];
      for (let i = 0; i < BIRD_POOL_SIZE; i++) {
        pool.push({ ...createFlyingBird(BIRD_COLORS[i % BIRD_COLORS.length]), active: false, plan: null, age: 0 });
      }
      return pool;
    }

    function planBirdFlight(center, size, fromPoint, density, random) {
      const count = density < 0.3 ? 1 : 2 + Math.floor(random() * 3);
      const awayAngle = Math.atan2(center.x - fromPoint.x, center.z - fromPoint.z);
      const flights = [];
      for (let i = 0; i < count; i++) {
        const angle = random() * Math.PI * 2;
        const radius = random() * 0.9 * size;
        const heading = awayAngle + (random() * 2 - 1) * BIRD_SPREAD;
        const speed = 4 + random() * 2;
        flights.push({
          x: center.x + Math.cos(angle) * radius,
          z: center.z + Math.sin(angle) * radius,
          startY: (2.5 + random() * 1.3) * size,
          heading,
          speedX: Math.sin(heading) * speed,
          speedZ: Math.cos(heading) * speed,
          climb: 1.5 + random(),
          flapRate: 8 + random() * 4,
          life: 3 + random()
        });
      }
      return { flights, awayAngle };
    }

    function readBirdFlightState(plan, age) {
      const progress = Math.min(age / plan.life, 1);
      const easedAge = age < 0.3 ? (age * age) / 0.6 : age - 0.15;
      return {
        x: plan.x + plan.speedX * easedAge,
        y: plan.startY + plan.climb * easedAge,
        z: plan.z + plan.speedZ * easedAge,
        heading: plan.heading,
        wing: Math.sin(age * plan.flapRate * Math.PI * 2) * 0.9,
        opacity: progress > 0.8 ? (1 - progress) / 0.2 : 1,
        done: progress >= 1
      };
    }

    const birdPool = createBirdPool();
    let nextBirdSlot = 0;

    function releaseBirds(item, fromPoint) {
      const { flights } = planBirdFlight(item.tree.position, item.tree.scale.x, fromPoint, timeTarget.birds, Math.random);
      for (const plan of flights) {
        const slot = birdPool[nextBirdSlot];
        nextBirdSlot = (nextBirdSlot + 1) % birdPool.length;
        slot.active = true;
        slot.plan = plan;
        slot.age = 0;
        slot.bird.visible = true;
      }
    }

    function updateFlyingBirds(delta) {
      for (const slot of birdPool) {
        if (!slot.active) continue;
        slot.age += delta;
        const state = readBirdFlightState(slot.plan, slot.age);
        if (state.done) {
          slot.active = false;
          slot.bird.visible = false;
          continue;
        }
        slot.bird.position.set(state.x, state.y, state.z);
        slot.bird.rotation.y = state.heading;
        for (const wing of slot.wings) wing.pivot.rotation.z = wing.side * state.wing;
        for (const material of slot.materials) material.opacity = state.opacity;
      }
    }

    const stars = createStars();

    const TIME_SETTINGS = {
      dawn: { sky: 0x5a6a8a, sun: 0.5, sunColor: 0x9fb4e0, sunPosition: [30, 8, -20], ambient: 0.7, stars: 0.3, fog: 0.03, birds: 1.5 },
      morning: { sky: 0xbcd3e6, sun: 1.2, sunColor: 0xffd8a8, sunPosition: [35, 14, -15], ambient: 0.9, stars: 0, fog: 0.02, birds: 1.3 },
      day: { sky: 0x8fc4ea, sun: 1.6, sunColor: 0xffffff, sunPosition: [10, 40, 10], ambient: 1.1, stars: 0, fog: 0.015, birds: 1 },
      evening: { sky: 0x6a4a6e, sun: 0.8, sunColor: 0xffa060, sunPosition: [-35, 10, 15], ambient: 0.7, stars: 0.2, fog: 0.025, birds: 0.6 },
      night: { sky: 0x0d1428, sun: 0.6, sunColor: 0x8fa6d8, sunPosition: [-20, 30, -10], ambient: 0.6, stars: 1, fog: 0.035, birds: 0.15 }
    };
    const TIME_CHECK_MS = 60000;

    function pickTimeOfDay(hour) {
      if (hour >= 4 && hour < 6) return 'dawn';
      if (hour >= 6 && hour < 10) return 'morning';
      if (hour >= 10 && hour < 17) return 'day';
      if (hour >= 17 && hour < 20) return 'evening';
      return 'night';
    }

    function readTimeOverride() {
      const value = new URLSearchParams(window.location.search).get('time');
      return Object.hasOwn(TIME_SETTINGS, value ?? '') ? value : null;
    }

    const timeOverride = readTimeOverride();

    function readCurrentTimeOfDay() {
      return timeOverride || pickTimeOfDay(new Date().getHours());
    }

    let timeTarget = TIME_SETTINGS[readCurrentTimeOfDay()];
    const timeTargetSky = new THREE.Color(timeTarget.sky);
    const timeTargetSunColor = new THREE.Color(timeTarget.sunColor);
    const timeTargetSunPosition = new THREE.Vector3(...timeTarget.sunPosition);
    const timeLook = {
      sky: new THREE.Color(timeTarget.sky),
      sun: timeTarget.sun,
      sunColor: new THREE.Color(timeTarget.sunColor),
      sunPosition: new THREE.Vector3(...timeTarget.sunPosition),
      ambient: timeTarget.ambient,
      stars: timeTarget.stars,
      fog: timeTarget.fog
    };

    function updateTimeOfDay() {
      if (timeOverride) return;
      timeTarget = TIME_SETTINGS[readCurrentTimeOfDay()];
      timeTargetSky.set(timeTarget.sky);
      timeTargetSunColor.set(timeTarget.sunColor);
      timeTargetSunPosition.set(...timeTarget.sunPosition);
    }

    function applyTimeOfDay(delta) {
      const follow = 1 - Math.exp(-delta * 0.8);
      timeLook.sky.lerp(timeTargetSky, follow);
      timeLook.sunColor.lerp(timeTargetSunColor, follow);
      timeLook.sunPosition.lerp(timeTargetSunPosition, follow);
      timeLook.sun += (timeTarget.sun - timeLook.sun) * follow;
      timeLook.ambient += (timeTarget.ambient - timeLook.ambient) * follow;
      timeLook.stars += (timeTarget.stars - timeLook.stars) * follow;
      timeLook.fog += (timeTarget.fog - timeLook.fog) * follow;
      scene.background.copy(timeLook.sky);
      scene.fog.color.copy(timeLook.sky);
      scene.fog.density = timeLook.fog;
      skyLight.intensity = timeLook.ambient;
      sunLight.intensity = timeLook.sun;
      sunLight.color.copy(timeLook.sunColor);
      sunLight.position.copy(timeLook.sunPosition);
      stars.material.opacity = timeLook.stars;
      stars.visible = timeLook.stars > 0.01;
    }
    const character = createCharacter();
    const targetMarker = createTargetMarker();
    let walkTarget = null;
    placeAtSpawn(pickSpawnPoint([]));

    function readSoundBoost(time) {
      const progress = (time - soundBoostStart) / VIEW_SECONDS;
      if (progress < 0 || progress >= 1) return 0;
      if (progress < 0.15) return Math.sin((progress / 0.15) * Math.PI / 2);
      const fall = (progress - 0.15) / 0.85;
      return 0.5 + Math.cos(fall * Math.PI) * 0.5;
    }

    function readLookUpAmount(time, start) {
      return -readViewCurve(time, start) * 0.45;
    }

    function readTodayKey() {
      const today = new Date();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${today.getFullYear()}-${month}-${day}`;
    }

    function loadTreeCount() {
      try {
        const saved = JSON.parse(localStorage.getItem(TREE_STORAGE_KEY));
        if (saved && saved.date === readTodayKey() && Number.isInteger(saved.count) && saved.count >= 0) {
          return saved.count;
        }
      } catch (error) {
        // 저장소를 못 쓰거나 값이 깨졌으면 0부터 센다
      }
      return 0;
    }

    function saveTreeCount(count) {
      try {
        localStorage.setItem(TREE_STORAGE_KEY, JSON.stringify({ date: readTodayKey(), count }));
      } catch (error) {
        // 저장소를 못 써도 화면은 그대로 쓴다
      }
    }

    function showTreeCount(count) {
      treeCountLabel.textContent = `오늘 본 나무 ${count}그루`;
    }

    function showHint(text) {
      clearTimeout(hintTimer);
      hint.textContent = text;
      hint.classList.remove('hidden');
      hintTimer = setTimeout(hideHint, 2500);
    }

    function findNearTree(point, candidates) {
      let nearest = null;
      let nearestGap = Infinity;
      for (const item of candidates) {
        const gap = Math.hypot(point.x - item.tree.position.x, point.z - item.tree.position.z) - item.trunkRadius;
        if (gap <= TREE_REACH && gap < nearestGap) {
          nearest = item;
          nearestGap = gap;
        }
      }
      return nearest;
    }

    function updateTreeButton() {
      const near = Boolean(findNearTree(character.position, reachableTrees));
      viewTreeButton.classList.toggle('far', !near);
      viewTreeButton.setAttribute('aria-disabled', String(!near));
    }

    function viewTree() {
      viewTreeButton.blur();
      const item = findNearTree(character.position, reachableTrees);
      if (!item) {
        showHint('나무 가까이 가면 볼 수 있어요');
        return;
      }
      const today = readTodayKey();
      if (treeDate !== today) {
        treeDate = today;
        treeCount = 0;
      }
      treeCount = Math.max(treeCount, loadTreeCount()) + 1;
      saveTreeCount(treeCount);
      showTreeCount(treeCount);

      walkTarget = null;
      character.rotation.y = Math.atan2(
        item.tree.position.x - character.position.x,
        item.tree.position.z - character.position.z
      );
      const now = clock.elapsedTime;
      myView = { item, start: now };
      item.shakeStart = now;
      dropLeaves(item);
      releaseBirds(item, character.position);
      soundBoostStart = now;
      wakeBirds();
      shareTreeView(item.index);
    }

    function readMyViewStart() {
      return myView ? myView.start : -Infinity;
    }

    function stopMyView() {
      myView = null;
    }

    function checkTreeIndex(value) {
      return Number.isInteger(value) && value >= 0 && value < trees.length;
    }

    function createNoiseBuffer(context, seconds) {
      const buffer = context.createBuffer(1, Math.floor(context.sampleRate * seconds), context.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      return buffer;
    }

    function createWindSound(context, destination, noiseBuffer) {
      const source = context.createBufferSource();
      source.buffer = noiseBuffer;
      source.loop = true;

      const filter = context.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 380;
      filter.Q.value = 0.7;

      const gain = context.createGain();
      gain.gain.value = 0.07;

      const gust = context.createOscillator();
      gust.frequency.value = 0.08;
      const gustDepth = context.createGain();
      gustDepth.gain.value = 0.04;
      gust.connect(gustDepth).connect(gain.gain);

      const sweep = context.createOscillator();
      sweep.frequency.value = 0.05;
      const sweepDepth = context.createGain();
      sweepDepth.gain.value = 150;
      sweep.connect(sweepDepth).connect(filter.frequency);

      source.connect(filter).connect(gain).connect(destination);
      source.start();
      gust.start();
      sweep.start();
    }

    function planBirdPhrase(random) {
      const notes = [];
      const kind = Math.floor(random() * 3);
      const volume = 0.05 + random() * 0.04;
      if (kind === 0) {
        // 올라가는 휘파람
        const count = 2 + Math.floor(random() * 2);
        let start = 0;
        for (let i = 0; i < count; i++) {
          const from = 2500 + random() * 500;
          const duration = 0.12 + random() * 0.08;
          notes.push({ start, duration, from, to: from + 1000 + random() * 500, volume });
          start += duration + 0.08 + random() * 0.08;
        }
      } else if (kind === 1) {
        // 떨림(트릴)
        const count = 6 + Math.floor(random() * 5);
        const pitch = 3500 + random() * 1500;
        for (let i = 0; i < count; i++) {
          notes.push({ start: i * 0.07, duration: 0.05, from: pitch, to: pitch * 0.92, volume: volume * 0.8 });
        }
      } else {
        // 두 음 부르기
        const high = 3800 + random() * 800;
        const low = high * (0.72 + random() * 0.08);
        for (let repeat = 0; repeat < 2; repeat++) {
          const base = repeat * 0.45;
          notes.push({ start: base, duration: 0.14, from: high, to: high * 1.02, volume });
          notes.push({ start: base + 0.18, duration: 0.16, from: low, to: low * 0.97, volume });
        }
      }
      return { notes, pan: random() * 1.6 - 0.8 };
    }

    function readBirdGap(random, birds, boost) {
      const seconds = 1.5 + random() * 4.5;
      return (seconds * 1000) / (Math.max(birds, 0.05) * (1 + boost * 2));
    }

    function playBirdPhrase(phrase, strength) {
      const { context, master } = audio;
      const begin = context.currentTime + 0.02;
      let output = master;
      if (context.createStereoPanner) {
        const panner = context.createStereoPanner();
        panner.pan.value = phrase.pan;
        panner.connect(master);
        output = panner;
      }
      for (const note of phrase.notes) {
        const start = begin + note.start;
        const end = start + note.duration;
        const oscillator = context.createOscillator();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(note.from, start);
        oscillator.frequency.exponentialRampToValueAtTime(note.to, end);
        const gain = context.createGain();
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(note.volume * strength, start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, end);
        oscillator.connect(gain).connect(output);
        oscillator.start(start);
        oscillator.stop(end + 0.02);
      }
    }

    function scheduleBirdSongs() {
      if (!soundOn) return;
      const boost = readSoundBoost(clock.elapsedTime);
      playBirdPhrase(planBirdPhrase(Math.random), 1 + boost * 0.5);
      birdTimer = setTimeout(scheduleBirdSongs, readBirdGap(Math.random, timeTarget.birds, boost));
    }

    function wakeBirds() {
      if (!soundOn) return;
      clearTimeout(birdTimer);
      birdTimer = setTimeout(scheduleBirdSongs, 200 + Math.random() * 400);
    }

    function startSound() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) {
        showHint('이 브라우저는 소리를 낼 수 없어요');
        return false;
      }
      const context = new AudioContextClass();
      const master = context.createGain();
      master.gain.value = 0;
      master.connect(context.destination);
      const noiseBuffer = createNoiseBuffer(context, 2);
      createWindSound(context, master, noiseBuffer);
      audio = { context, master, noiseBuffer };
      return true;
    }

    function updateSoundButton() {
      soundButton.textContent = soundOn ? '소리 끄기' : '소리 켜기';
      soundButton.setAttribute('aria-pressed', String(soundOn));
    }

    function fadeMaster(target) {
      const now = audio.context.currentTime;
      const volume = audio.master.gain;
      volume.cancelScheduledValues(now);
      volume.setValueAtTime(volume.value, now);
      volume.linearRampToValueAtTime(target, now + 0.3);
    }

    async function toggleSound() {
      soundButton.blur();
      if (!audio && !startSound()) return;
      clearTimeout(birdTimer);
      soundOn = !soundOn;
      updateSoundButton();

      if (soundOn) {
        await audio.context.resume();
        fadeMaster(SOUND_VOLUME);
        scheduleBirdSongs();
      } else {
        fadeMaster(0);
        setTimeout(() => {
          if (!soundOn) audio.context.suspend();
        }, 350);
      }
    }

    function resumeSoundAfterReturn() {
      if (document.visibilityState === 'visible' && soundOn && audio.context.state !== 'running') {
        audio.context.resume();
      }
    }

    function readSpawnSlots() {
      const slots = [];
      for (let row = 0; row < 6; row++) {
        for (const column of [-1, 0, 1]) {
          slots.push({ x: column, z: SPAWN_START_Z - row * 1.5 });
        }
      }
      return slots;
    }

    function pickSpawnPoint(others) {
      const slots = readSpawnSlots();
      if (!others.length) return slots[Math.floor(Math.random() * 3)];
      let best = slots[0];
      let bestGap = -1;
      for (const slot of slots) {
        const gap = Math.min(...others.map((other) => Math.hypot(other.x - slot.x, other.z - slot.z)));
        if (gap > bestGap) {
          best = slot;
          bestGap = gap;
        }
      }
      return best;
    }

    function placeAtSpawn(point) {
      character.position.set(point.x, 0, point.z);
      character.rotation.y = Math.PI;
      walkTarget = null;
    }

    function keepInWalkArea(point, obstacles) {
      const limitX = WALK_HALF_WIDTH;
      const limitZ = GROUND_HALF_LENGTH - 1;
      point.x = Math.max(-limitX, Math.min(limitX, point.x));
      point.z = Math.max(-limitZ, Math.min(limitZ, point.z));
      for (const obstacle of obstacles) {
        const dx = point.x - obstacle.x;
        const dz = point.z - obstacle.z;
        const minDistance = obstacle.radius + BODY_RADIUS;
        const distance = Math.hypot(dx, dz);
        if (distance >= minDistance) continue;
        if (distance < 1e-6) {
          point.x = obstacle.x + minDistance;
        } else {
          point.x = obstacle.x + (dx / distance) * minDistance;
          point.z = obstacle.z + (dz / distance) * minDistance;
        }
      }
      point.x = Math.max(-limitX, Math.min(limitX, point.x));
      point.z = Math.max(-limitZ, Math.min(limitZ, point.z));
      return point;
    }

    function readMyAge() {
      return (performance.now() - joinedAt) / 1000;
    }

    function readPeerPoints() {
      const points = [];
      for (const peer of peers.values()) {
        if (peer.target) points.push(peer.target);
      }
      return points;
    }

    function readPose(data) {
      if (!data || typeof data !== 'object') return null;
      const { x, z, ry, age } = data;
      if (![x, z, ry, age].every(Number.isFinite)) return null;
      const clampedX = THREE.MathUtils.clamp(x, -GROUND_HALF_WIDTH + 0.5, GROUND_HALF_WIDTH - 0.5);
      const clampedZ = THREE.MathUtils.clamp(z, -GROUND_HALF_LENGTH + 0.5, GROUND_HALF_LENGTH - 0.5);
      return { x: clampedX, z: clampedZ, ry, age };
    }

    function pickPeerColor(peerId) {
      let hash = 0;
      for (const letter of String(peerId)) {
        hash = (hash * 31 + letter.charCodeAt(0)) >>> 0;
      }
      const hue = 0.08 + (hash % 1000) / 1000 * 0.84;
      return new THREE.Color().setHSL(hue, 0.55, 0.45).getHex();
    }

    function showPeopleCount() {
      if (roomState === 'connecting') {
        peopleLabel.textContent = '연결하는 중…';
      } else if (roomState === 'solo') {
        peopleLabel.textContent = '혼자 있어요';
      } else {
        peopleLabel.textContent = `${roomName} · 함께 ${peers.size + 1}명`;
      }
      updateChatInput();
    }

    function addPeer(peerId) {
      if (peers.has(peerId)) return peers.get(peerId);
      const doll = createCharacter(pickPeerColor(peerId));
      doll.visible = false;
      const peer = {
        doll,
        target: null,
        lastSeen: performance.now(),
        lookStart: -Infinity,
        lastTreeAt: -Infinity,
        lastChatAt: -Infinity
      };
      peers.set(peerId, peer);
      showPeopleCount();
      return peer;
    }

    function removePeer(peerId) {
      const peer = peers.get(peerId);
      if (!peer) return;
      removeChatBubble(peer.doll);
      scene.remove(peer.doll);
      peer.doll.traverse((part) => {
        if (part.geometry) part.geometry.dispose();
        if (part.material) part.material.dispose();
      });
      peers.delete(peerId);
      showPeopleCount();
    }

    function cleanChatText(value) {
      if (typeof value !== 'string') return '';
      const flat = value
        .replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u2028-\u202e\u2060-\u2069\ufeff]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      return Array.from(flat).slice(0, CHAT_MAX_LENGTH).join('');
    }

    function updateChatInput() {
      const usable = roomState === 'online';
      chatInput.disabled = !usable;
      chatSendButton.disabled = !usable;
      chatInput.placeholder = usable
        ? '짧은 말 (개인정보는 쓰지 마세요)'
        : '혼자 있을 때는 보낼 수 없어요 (개인정보는 쓰지 마세요)';
    }

    function removeChatBubble(owner) {
      const bubble = chatBubbles.get(owner);
      if (!bubble) return;
      clearTimeout(bubble.timer);
      bubble.element.remove();
      chatBubbles.delete(owner);
    }

    function showChatBubble(owner, text) {
      let bubble = chatBubbles.get(owner);
      if (!bubble) {
        const element = document.createElement('div');
        element.className = 'chatBubble';
        bubbleLayer.appendChild(element);
        bubble = { element, timer: null };
        chatBubbles.set(owner, bubble);
      }
      bubble.element.textContent = text;
      clearTimeout(bubble.timer);
      bubble.timer = setTimeout(() => removeChatBubble(owner), CHAT_BUBBLE_MS);
      placeChatBubbles();
    }

    const bubblePoint = new THREE.Vector3();
    function placeChatBubbles() {
      for (const [owner, bubble] of chatBubbles) {
        owner.getWorldPosition(bubblePoint);
        bubblePoint.y += 1.75;
        bubblePoint.project(camera);
        const onScreen = owner.visible && bubblePoint.z < 1 && Math.abs(bubblePoint.x) < 1.2 && Math.abs(bubblePoint.y) < 1.2;
        bubble.element.style.display = onScreen ? 'block' : 'none';
        bubble.element.style.left = `${(bubblePoint.x * 0.5 + 0.5) * window.innerWidth}px`;
        bubble.element.style.top = `${(-bubblePoint.y * 0.5 + 0.5) * window.innerHeight}px`;
      }
    }

    function sendChat(event) {
      event.preventDefault();
      if (roomState !== 'online' || !chatOn) return;
      const now = performance.now();
      if (now - lastChatSentAt < CHAT_SEND_GAP_MS) {
        showHint('조금 있다가 다시 보내 주세요');
        return;
      }
      const text = cleanChatText(chatInput.value);
      chatInput.value = '';
      if (!text) return;
      lastChatSentAt = now;
      showChatBubble(character, text);
      if (sendChatAction) Promise.resolve(sendChatAction({ text })).catch(() => {});
    }

    function receiveChat(data, peerId) {
      if (!chatOn) return;
      const peer = peers.get(peerId);
      if (!peer || !peer.target) return;
      const now = performance.now();
      if (now - peer.lastChatAt < CHAT_RECEIVE_GAP_MS) return;
      const text = cleanChatText(data && data.text);
      if (!text) return;
      peer.lastChatAt = now;
      showChatBubble(peer.doll, text);
    }

    function toggleChat() {
      chatOn = !chatOn;
      chatToggle.textContent = chatOn ? '채팅 끄기' : '채팅 켜기';
      chatForm.hidden = !chatOn;
      if (!chatOn) {
        chatInput.blur();
        for (const owner of [...chatBubbles.keys()]) removeChatBubble(owner);
      }
    }

    function checkTypingTarget(target) {
      return target instanceof HTMLElement && Boolean(target.closest('input, textarea'));
    }

    function avoidOverlapOnJoin(pose) {
      if (hasMoved || readMyAge() >= pose.age) return;
      if (Math.hypot(pose.x - character.position.x, pose.z - character.position.z) >= SPAWN_GAP) return;
      placeAtSpawn(pickSpawnPoint(readPeerPoints()));
      followCamera(0, true);
      shareMyPose();
    }

    function receivePose(data, peerId) {
      const pose = readPose(data);
      if (!pose) return;
      const peer = addPeer(peerId);
      const firstPose = !peer.target;
      peer.target = pose;
      peer.lastSeen = performance.now();
      if (firstPose) {
        peer.doll.position.set(pose.x, 0, pose.z);
        peer.doll.rotation.y = pose.ry;
        peer.doll.visible = true;
        avoidOverlapOnJoin(pose);
      }
    }

    function receiveTreeView(data, peerId) {
      const peer = peers.get(peerId);
      if (!peer || !peer.target) return;
      if (!data || typeof data !== 'object' || !checkTreeIndex(data.tree)) return;
      const nowMs = performance.now();
      if (nowMs - peer.lastTreeAt < TREE_RECEIVE_GAP_MS) return;
      peer.lastTreeAt = nowMs;
      const now = clock.elapsedTime;
      peer.lookStart = now;
      trees[data.tree].shakeStart = now;
      dropLeaves(trees[data.tree]);
      releaseBirds(trees[data.tree], peer.doll.position);
      soundBoostStart = now;
      wakeBirds();
    }

    function shareMyPose() {
      if (!sendPoseAction) return;
      const round = (value) => Math.round(value * 100) / 100;
      const pose = {
        x: round(character.position.x),
        z: round(character.position.z),
        ry: round(character.rotation.y),
        age: round(readMyAge())
      };
      Promise.resolve(sendPoseAction(pose)).catch(() => {});
    }

    function shareTreeView(treeIndex) {
      if (!sendTreeAction) return;
      Promise.resolve(sendTreeAction({ tree: treeIndex })).catch(() => {});
    }

    function updatePeers(delta, time) {
      const now = performance.now();
      const follow = 1 - Math.exp(-delta * 10);
      for (const [peerId, peer] of peers) {
        if (now - peer.lastSeen > PEER_TIMEOUT_MS) {
          removePeer(peerId);
          continue;
        }
        if (!peer.target) continue;
        const remaining = Math.hypot(peer.target.x - peer.doll.position.x, peer.target.z - peer.doll.position.z);
        stepWalkAnimation(peer.doll, remaining > 0.05, delta);
        peer.doll.position.x += (peer.target.x - peer.doll.position.x) * follow;
        peer.doll.position.z += (peer.target.z - peer.doll.position.z) * follow;
        let turn = peer.target.ry - peer.doll.rotation.y;
        turn = Math.atan2(Math.sin(turn), Math.cos(turn));
        peer.doll.rotation.y += turn * follow;
        poseCharacter(peer.doll, readLookUpAmount(time, peer.lookStart));
      }
    }

    function joinRoomByName(name) {
      const room = joinRoomFunction({ appId: APP_ID }, name);
      const fromThisRoom = (handler) => (...args) => {
        if (room === currentRoom) handler(...args);
      };
      const [sendPose, getPose] = room.makeAction('pose');
      const [sendTree, getTree] = room.makeAction('tree');
      const [sendChatMessage, getChat] = room.makeAction('chat');
      getPose(fromThisRoom(receivePose));
      getTree(fromThisRoom(receiveTreeView));
      getChat(fromThisRoom(receiveChat));
      room.onPeerJoin(fromThisRoom((peerId) => {
        addPeer(peerId);
        shareMyPose();
      }));
      room.onPeerLeave(fromThisRoom(removePeer));

      currentRoom = room;
      roomName = name;
      sendPoseAction = sendPose;
      sendTreeAction = sendTree;
      sendChatAction = sendChatMessage;
      joinedAt = performance.now();
      roomState = 'online';
      clearTimeout(roomCheckTimer);
      if (name === ROOM_NAMES[0]) {
        roomCheckTimer = setTimeout(checkRoomFull, ROOM_SETTLE_MS);
      }
      showPeopleCount();
    }

    function checkRoomFull() {
      if (roomName !== ROOM_NAMES[0] || !currentRoom) return;
      const now = performance.now();
      const myAge = readMyAge();
      let olderPeople = 0;
      for (const peer of peers.values()) {
        if (!peer.target) continue;
        const peerAge = peer.target.age + (now - peer.lastSeen) / 1000;
        if (peerAge > myAge) olderPeople += 1;
      }
      if (olderPeople >= ROOM_LIMIT) moveToRoom(ROOM_NAMES[1]);
    }

    function moveToRoom(name) {
      const oldRoom = currentRoom;
      currentRoom = null;
      sendPoseAction = null;
      sendTreeAction = null;
      sendChatAction = null;
      try {
        oldRoom.leave();
      } catch (error) {
        // 이미 끊긴 방이면 그냥 넘어간다
      }
      for (const peerId of [...peers.keys()]) removePeer(peerId);
      joinRoomByName(name);
      showHint(`${ROOM_NAMES[0]} 방이 꽉 차서 ${name} 방으로 옮겼어요`);
    }

    async function connectRoom() {
      try {
        if (!window.isSecureContext || !window.crypto?.subtle) {
          throw new Error('https나 내 컴퓨터 파일로 열지 않아 암호화 기능을 쓸 수 없어요');
        }
        const { joinRoom } = await import(TRYSTERO_URL);
        joinRoomFunction = joinRoom;
        joinRoomByName(ROOM_NAMES[0]);
        setInterval(shareMyPose, POSE_INTERVAL_MS);
        window.addEventListener('pagehide', () => {
          if (currentRoom) currentRoom.leave();
        });
      } catch (error) {
        roomState = 'solo';
        console.warn('함께 보기 연결을 못 해 혼자 모드로 둡니다.', error);
      }
      showPeopleCount();
    }

    function readKeys() {
      const has = (...codes) => codes.some((code) => pressedKeys.has(code));
      return {
        forward: (has('KeyW', 'ArrowUp') ? 1 : 0) - (has('KeyS', 'ArrowDown') ? 1 : 0),
        turn: (has('KeyA', 'ArrowLeft') ? 1 : 0) - (has('KeyD', 'ArrowRight') ? 1 : 0)
      };
    }

    function pickGroundPoint(event) {
      pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObject(ground)[0];
      return hit ? hit.point : null;
    }

    function turnToward(targetAngle, maxStep) {
      let difference = targetAngle - character.rotation.y;
      difference = Math.atan2(Math.sin(difference), Math.cos(difference));
      character.rotation.y += THREE.MathUtils.clamp(difference, -maxStep, maxStep);
    }

    function moveCharacter(delta, time) {
      const keys = readKeys();
      let moving = false;

      if (keys.forward !== 0 || keys.turn !== 0) {
        walkTarget = null;
        character.rotation.y += keys.turn * TURN_SPEED * delta;
        if (keys.forward !== 0) {
          const step = keys.forward * WALK_SPEED * delta;
          character.position.x += Math.sin(character.rotation.y) * step;
          character.position.z += Math.cos(character.rotation.y) * step;
          moving = true;
        }
      } else if (walkTarget) {
        const dx = walkTarget.x - character.position.x;
        const dz = walkTarget.z - character.position.z;
        const distance = Math.hypot(dx, dz);
        if (distance < 0.1) {
          walkTarget = null;
        } else {
          turnToward(Math.atan2(dx, dz), TURN_SPEED * 2 * delta);
          const step = Math.min(WALK_SPEED * delta, distance);
          const beforeX = character.position.x;
          const beforeZ = character.position.z;
          character.position.x += (dx / distance) * step;
          character.position.z += (dz / distance) * step;
          keepInWalkArea(character.position, walkObstacles);
          const moved = Math.hypot(character.position.x - beforeX, character.position.z - beforeZ);
          if (moved < step * 0.2) walkTarget = null;
          moving = true;
        }
      }
      keepInWalkArea(character.position, walkObstacles);

      if (moving) hasMoved = true;
      if (moving) stopMyView();
      if (myView && time - myView.start >= VIEW_SECONDS) stopMyView();
      stepWalkAnimation(character, moving, delta);
      poseCharacter(character, readLookUpAmount(time, readMyViewStart()));

      targetMarker.material.opacity = walkTarget ? 0.8 : Math.max(0, targetMarker.material.opacity - delta * 2);
    }

    const cameraLookPoint = new THREE.Vector3();
    function followCamera(delta, snap) {
      const heading = character.rotation.y;
      const desired = new THREE.Vector3(
        character.position.x - Math.sin(heading) * CAMERA_DISTANCE,
        character.position.y + CAMERA_HEIGHT,
        character.position.z - Math.cos(heading) * CAMERA_DISTANCE
      );
      const lookTarget = new THREE.Vector3(character.position.x, character.position.y + 1.1, character.position.z);

      const blend = myView ? readViewCurve(clock.elapsedTime, myView.start) : 0;
      if (blend > 0) {
        const treePosition = myView.item.tree.position;
        const viewPosition = new THREE.Vector3(
          character.position.x - Math.sin(heading) * 2,
          myView.item.topHeight * 1.1,
          character.position.z - Math.cos(heading) * 2
        );
        const treeTop = new THREE.Vector3(treePosition.x, myView.item.topHeight, treePosition.z);
        desired.lerp(viewPosition, blend);
        lookTarget.lerp(treeTop, blend);
      }

      if (snap) {
        camera.position.copy(desired);
        cameraLookPoint.copy(lookTarget);
      } else {
        const follow = 1 - Math.exp(-delta * 4);
        camera.position.lerp(desired, follow);
        cameraLookPoint.lerp(lookTarget, follow);
      }
      camera.lookAt(cameraLookPoint);
    }

    function resizeView() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function hideHint() {
      hint.classList.add('hidden');
    }

    function startWalkTo(event) {
      const point = pickGroundPoint(event);
      if (!point) return;
      const target = keepInWalkArea({ x: point.x, z: point.z }, walkObstacles);
      walkTarget = new THREE.Vector3(target.x, 0, target.z);
      targetMarker.position.set(target.x, 0.03, target.z);
      hideHint();
    }

    window.addEventListener('keydown', (event) => {
      if (checkTypingTarget(event.target)) {
        if (event.key === 'Escape') event.target.blur();
        return;
      }
      if (event.code.startsWith('Arrow')) event.preventDefault();
      pressedKeys.add(event.code);
      hideHint();
    });
    window.addEventListener('keyup', (event) => pressedKeys.delete(event.code));
    window.addEventListener('blur', () => pressedKeys.clear());
    window.addEventListener('resize', resizeView);
    renderer.domElement.addEventListener('pointerdown', startWalkTo);
    viewTreeButton.addEventListener('click', viewTree);
    soundButton.addEventListener('click', toggleSound);
    chatForm.addEventListener('submit', sendChat);
    chatToggle.addEventListener('click', toggleChat);
    chatInput.addEventListener('focus', () => pressedKeys.clear());
    document.addEventListener('visibilitychange', resumeSoundAfterReturn);

    const clock = new THREE.Clock();
    function renderFrame() {
      const delta = Math.min(clock.getDelta(), 0.05);
      const time = clock.elapsedTime;
      moveCharacter(delta, time);
      updatePeers(delta, time);
      updateTreeButton();
      applyTimeOfDay(delta);
      swayLeaves(time);
      updateFallingLeaves(delta);
      updateFlyingBirds(delta);
      followCamera(delta, false);
      placeChatBubbles();
      renderer.render(scene, camera);
      requestAnimationFrame(renderFrame);
    }

    hint.textContent = 'WASD · 방향키로 걷거나, 바닥을 눌러 그곳으로 걸어가요';
    hintTimer = setTimeout(hideHint, 8000);
    treeDate = readTodayKey();
    treeCount = loadTreeCount();
    showTreeCount(treeCount);
    followCamera(0, true);
    setInterval(updateTimeOfDay, TIME_CHECK_MS);
    renderFrame();
    connectRoom();
  </script>
</body>
</html>
