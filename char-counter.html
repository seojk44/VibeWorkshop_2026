<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글자 수 세기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #f5f6f7;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    color: #222;
  }

  /* 상단 흰색 영역 (검색창 영역) */
  .top {
    background: #fff;
    border-bottom: 1px solid #e3e5e8;
    padding: 56px 16px 40px;
  }
  .inner {
    max-width: 640px;
    margin: 0 auto;
  }
  h1 {
    margin: 0 0 24px;
    text-align: center;
    font-size: 40px;
    font-weight: 900;
    letter-spacing: -2px;
    color: #03c75a;
  }

  /* 초록 테두리 검색창 스타일 입력 박스 */
  .search-box {
    border: 2px solid #03c75a;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 2px 8px rgba(3,199,90,0.12);
    overflow: hidden;
  }
  textarea {
    display: block;
    width: 100%;
    height: 160px;
    padding: 16px 18px;
    font-size: 17px;
    line-height: 1.5;
    border: none;
    outline: none;
    resize: vertical;
    font-family: inherit;
    color: #222;
  }
  textarea::placeholder {
    color: #b0b3b8;
  }
  .search-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 10px 18px;
    border-top: 1px solid #eef0f2;
  }

  .limit-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: #666;
    margin-right: auto;
  }
  .limit-row input {
    width: 80px;
    padding: 7px 8px;
    font-size: 14px;
    border: 1px solid #dadce0;
    border-radius: 6px;
    font-family: inherit;
    outline: none;
  }
  .limit-row input:focus {
    border-color: #03c75a;
  }

  button {
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: #03c75a;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  button:hover {
    background: #02b350;
  }
  button.secondary {
    color: #555;
    background: #fff;
    border: 1px solid #dadce0;
    font-weight: 500;
  }
  button.secondary:hover {
    background: #f5f6f7;
  }

  /* 하단 회색 영역 (콘텐츠 카드) */
  .content {
    padding: 24px 16px 48px;
  }
  .result {
    padding: 20px;
    background: #fff;
    border: 1px solid #e3e5e8;
    border-radius: 12px;
    font-size: 16px;
    color: #444;
    text-align: center;
    display: none;
  }
  .result strong {
    font-size: 24px;
    color: #03c75a;
  }
  .result strong.over {
    color: #dc2626;
  }

  @media (max-width: 480px) {
    .top { padding-top: 32px; }
    h1 { font-size: 32px; }
    .search-bar { flex-wrap: wrap; }
    .limit-row { width: 100%; margin-bottom: 4px; }
    .search-bar button { flex: 1; }
  }
</style>
</head>
<body>
  <div class="top">
    <div class="inner">
      <h1>글자 수 세기</h1>
      <div class="search-box">
        <textarea id="textInput" placeholder="여기에 글을 입력하세요..."></textarea>
        <div class="search-bar">
          <label class="limit-row">
            제한 글자 수:
            <input type="number" id="limitInput" min="1" placeholder="없음">
            자
          </label>
          <button id="clearBtn" class="secondary">전체 지우기</button>
          <button id="countBtn">글자 수 세기</button>
        </div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="inner">
      <div id="result" class="result"></div>
    </div>
  </div>

<script>
  function updateCount() {
    var text = document.getElementById('textInput').value;
    var resultEl = document.getElementById('result');
    var noSpaceLength = text.replace(/\s/g, '').length;
    var limit = parseInt(document.getElementById('limitInput').value, 10);

    function num(n) {
      var over = limit > 0 && n > limit;
      return '<strong' + (over ? ' class="over"' : '') + '>' + n + '</strong>';
    }

    resultEl.innerHTML = '공백 포함: ' + num(text.length) + '자 &nbsp;|&nbsp; 공백 제외: ' + num(noSpaceLength) + '자';
    resultEl.style.display = 'block';
  }

  document.getElementById('clearBtn').addEventListener('click', function () {
    var input = document.getElementById('textInput');
    input.value = '';
    updateCount();
    input.focus();
  });

  document.getElementById('limitInput').addEventListener('input', function () {
    if (document.getElementById('result').style.display === 'block') {
      updateCount();
    }
  });

  document.getElementById('countBtn').addEventListener('click', updateCount);
  document.getElementById('textInput').addEventListener('input', updateCount);
</script>
</body>
</html>
